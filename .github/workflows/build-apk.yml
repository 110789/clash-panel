name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate app icon from resources/icon.png
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#000000'

      - name: Enable edge-to-edge (transparent status/nav bars)
        run: |
          python3 - << 'PY'
          import glob, re

          files = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)
          if not files:
              print("MainActivity.java not found, skip")
          else:
              path = files[0]
              src = open(path).read()
              m = re.search(r'^package\s+([\w.]+);', src, re.M)
              package = m.group(1) if m else "unknown"
              content = (
                  f"package {package};\n\n"
                  "import android.graphics.Color;\n"
                  "import android.os.Bundle;\n"
                  "import androidx.core.view.WindowCompat;\n"
                  "import com.getcapacitor.BridgeActivity;\n\n"
                  "public class MainActivity extends BridgeActivity {\n"
                  "    @Override\n"
                  "    protected void onCreate(Bundle savedInstanceState) {\n"
                  "        super.onCreate(savedInstanceState);\n"
                  "        WindowCompat.setDecorFitsSystemWindows(getWindow(), false);\n"
                  "        getWindow().setStatusBarColor(Color.TRANSPARENT);\n"
                  "        getWindow().setNavigationBarColor(Color.TRANSPARENT);\n"
                  "    }\n"
                  "}\n"
              )
              with open(path, "w") as f:
                  f.write(content)
              print(f"patched {path}")
          PY

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-panel-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
