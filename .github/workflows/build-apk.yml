name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate app icon from resources/icon.png
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#000000'

      - name: Apply immersive fullscreen theme
        run: |
          python3 - << 'PY'
          import re

          path = "android/app/src/main/res/values/styles.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          extra_items = (
              '\n        <item name="android:statusBarColor">#000000</item>'
              '\n        <item name="android:navigationBarColor">#000000</item>'
              '\n        <item name="android:windowDrawsSystemBarBackgrounds">true</item>'
              '\n        <item name="android:fitsSystemWindows">false</item>'
          )

          new_content, count = re.subn(
              r'(<style name="AppTheme"[^>]*>)',
              r'\1' + extra_items,
              content,
              count=1,
          )

          if count:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(new_content)
              print("styles.xml patched for immersive fullscreen")
          else:
              print("AppTheme style not found, skipped patch (icon/build still proceed)")
          PY

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-panel-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
